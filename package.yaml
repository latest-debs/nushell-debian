# Package definition for nushell

package_name: nushell
github_repo: nushell/nushell
artifact_format: tar.gz
description: "A new type of shell"
license: MIT

# Build for all Debian suites and all supported architectures.

# Binaries that must not be smoke-tested with --version (not standalone CLIs).
smoke_skip:
  - "nu_plugin_*"

# Smoke policy (read by the workflow at runtime)
min_glibc: "2.36"

# Opt into native Ubuntu builds (builder >= v.0.1a29). Packages without
# these are served from the Debian suites via the alias fallback.
ubuntu_distributions:
  - jammy
  - noble
  - resolute
